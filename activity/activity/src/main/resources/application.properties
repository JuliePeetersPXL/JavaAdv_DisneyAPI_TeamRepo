spring.application.name=activity

# Database: H2 in het geheugen, de database heet disneydb
spring.datasource.url=jdbc:h2:mem:disneydb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate maakt de tabellen uit de @Entity-klassen bij het opstarten en verwijdert ze bij het afsluiten
spring.jpa.hibernate.ddl-auto=create-drop
# SQL in de console tonen (handig om te leren en uit te leggen)
spring.jpa.show-sql=true

# Basis-URL van de externe Disney API (gebruiken we in stap 4)
disney.api.base-url=https://api.disneyapi.dev
